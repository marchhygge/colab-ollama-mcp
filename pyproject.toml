[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-ollama-mcp"
version = "1.0.0"
description = "Model Context Protocol (MCP) Server for Google Colab GPU-hosted Ollama LLM"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["mcp", "ollama", "google-colab", "cloudflare-tunnel", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
colab-ollama-mcp = "colab_ollama_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["colab_ollama_mcp*"]

